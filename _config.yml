title: Lyashchuk.pro
description: "Блог программиста Ильи Лящук — статьи о Laravel, PHP, автоматизации, open source и DevOps."
baseurl: ""
url: "https://lyashchuk.pro"
lang: ru_RU
timezone: Europe/Moscow

author:
  name: "Илья Лящук"
  url: "https://lyashchuk.pro/about/"
  twitter: prog_time

contact:
  github_username: "prog-time"
  github_url: "https://github.com/prog-time"
  telegram_username: "ilyalyashchuk"
  telegram_url: "https://t.me/ilyalyashchuk"
  email: "lyashchuk.ilya@mail.ru"
  habr_url: "https://habr.com/ru/users/Prog-Time/articles/"

twitter:
  username: prog_time
  card: summary

social:
  name: "Илья Лящук"
  links:
    - https://github.com/prog-time
    - https://t.me/iliyalyachuk

permalink: /articles/:year/:month/:day/:title

theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap

show_excerpts: true

sass:
  quiet_deps: true

collections:
  projects:
    output: true
    permalink: /projects/:name/
  jobs:
    output: true
    permalink: /experience/:name/
  portfolio:
    output: true
    permalink: /portfolio/:name/
  arduino:
    output: true
    permalink: /arduino/:name/
    sort_by: number

exclude:
  - templates/
  - arduino-inventory.md

header_pages:
  - about.md

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png
  - scope:
      path: ""
      type: arduino
    values:
      layout: arduino-entry
